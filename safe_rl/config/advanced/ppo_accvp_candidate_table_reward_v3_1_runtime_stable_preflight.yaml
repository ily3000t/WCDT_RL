run:
  run_id: "ppo_accvp_candidate_table_reward_v3_1_runtime_stable_preflight"
  output_root: "safe_rl_output/runs"
  tensorboard: false
  replay: false

experiment:
  note: "Step3.5 preflight/eval-only config for existing v3.1 PPO with stabilized ACCVP observation runtime."

forecast_features:
  enabled: false

rl:
  use_wcdt_forecast_features: false
  reward_profile: "merge_timing_forecast"
  training_semantics_version: "reward_v3_1_persistence_001+risk_gated_accvp_candidate_table_v2_persistence"
  shield_guided_reward:
    risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
  policy_lateral_commitment:
    enabled: true
    profile: "left_intent_1s_risk_gated_v2"
    duration_s: 1.0
    preserve_raw_accel: true
  merge_timing_reward:
    reward_version: "opportunity_window_v3_1_risk_gated_persistence"
    merge_intent_abort_penalty: -1.0
    merge_intent_continue_bonus: 0.2
    merge_intent_commitment_window_s: 1.0

accvp:
  enabled: false
  mode: "off"
  activation_distance: 240.0
  ensemble_size: 1
  checkpoint: "safe_rl_output/runs/accvp_240_shadow_train/accvp/accvp_v1_predictor.pt"
  calibration_bundle: "safe_rl_output/runs/accvp_240_shadow_train/accvp/accvp_v1_calibration.json"
  operating_point: "safe_rl_output/runs/accvp_240_lite_v3/accvp/accvp_v1_lite_v3_operating_point.json"
  artifact_manifest: "safe_rl_output/runs/accvp_240_lite_v3/accvp/accvp_v1_lite_v3_task_artifact_manifest.json"
  risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
  observation:
    enabled: true
    feature_version: "risk_gated_candidate_table_v2_persistence"
    activation_distance: 240.0
    timeout_s: 0.5
    use_inference_worker: false
    profile_latency: true
    fail_closed_defaults: true
    invalid_table_strategy: "last_valid_with_invalid_mask_v1"
    invalid_table_dropout_rate: 0.0
    warmup_enabled: true
    include_risk_secondary: true
    secondary_safety_profile: "short_horizon_risk_v1"
    risk_horizon_steps: 8
    allow_with_forecast_features: false
