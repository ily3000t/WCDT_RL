run:
  run_id: "stage5_accvp_table_v2_policy_commitment_diagnostic"
  output_root: "safe_rl_output/runs"
  tensorboard: false
  replay: true

experiment:
  purpose: "seed12_policy_commitment_diagnostic_no_retrain"
  deployable_claim: false
  note: "Uses existing ppo_accvp_candidate_table_reward_v2_v2 checkpoint; enables policy-side left intent commitment only at eval time."

stage5:
  paired_eval: true
  same_seed: true
  replay_enabled: true
  episodes_per_group: 1
  seeds: [12]
  risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
  task_quality:
    timely_entry_distance_threshold_m: 80.0
    late_merge_request_threshold_m: 60.0
  pairs:
    - name: "accvp_table_v2_vs_policy_commitment_seed12"
      left: "ppo_accvp_candidate_table_reward_v2_v2_prediction_shield"
      right: "ppo_accvp_candidate_table_reward_v2_v2_prediction_shield_policy_commitment"
      acceptance_profile: "mainline_reward_v2"
  groups:
    - name: "ppo_accvp_candidate_table_reward_v2_v2_prediction_shield"
      forecast_features: false
      shield: true
      model_path: "safe_rl_output/runs/ppo_accvp_candidate_table_reward_v2_v2/stage3/ppo_model.zip"
      raw_policy: "ppo_accvp_candidate_table_reward_v2_v2"
      counterfactual_predictor: "risk_gated_accvp_candidate_table_v1"
      shield_overrides:
        forecast_aware_candidate_ranking_mode: "off"
        forecast_task_shadow_enabled: false
        task_backstop_enabled: false
      accvp:
        enabled: false
        mode: "off"
        activation_distance: 240.0
        ensemble_size: 1
        checkpoint: "safe_rl_output/runs/accvp_240_shadow_train/accvp/accvp_v1_predictor.pt"
        calibration_bundle: "safe_rl_output/runs/accvp_240_shadow_train/accvp/accvp_v1_calibration.json"
        operating_point: "safe_rl_output/runs/accvp_240_lite_v3/accvp/accvp_v1_lite_v3_operating_point.json"
        artifact_manifest: "safe_rl_output/runs/accvp_240_lite_v3/accvp/accvp_v1_lite_v3_task_artifact_manifest.json"
        risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
        observation:
          enabled: true
          feature_version: "risk_gated_candidate_table_v1"
          activation_distance: 240.0
          timeout_s: 0.5
          use_inference_worker: false
          profile_latency: true
          fail_closed_defaults: true
          include_risk_secondary: true
          secondary_safety_profile: "short_horizon_risk_v1"
          risk_horizon_steps: 8
          allow_with_forecast_features: false

    - name: "ppo_accvp_candidate_table_reward_v2_v2_prediction_shield_policy_commitment"
      forecast_features: false
      shield: true
      model_path: "safe_rl_output/runs/ppo_accvp_candidate_table_reward_v2_v2/stage3/ppo_model.zip"
      raw_policy: "ppo_accvp_candidate_table_reward_v2_v2"
      counterfactual_predictor: "risk_gated_accvp_candidate_table_v1"
      controller: "policy_lateral_commitment_diagnostic"
      rl_overrides:
        policy_lateral_commitment:
          enabled: true
          profile: "left_intent_1s_v1"
          duration_s: 1.0
          preserve_raw_accel: true
      shield_overrides:
        forecast_aware_candidate_ranking_mode: "off"
        forecast_task_shadow_enabled: false
        task_backstop_enabled: false
      accvp:
        enabled: false
        mode: "off"
        activation_distance: 240.0
        ensemble_size: 1
        checkpoint: "safe_rl_output/runs/accvp_240_shadow_train/accvp/accvp_v1_predictor.pt"
        calibration_bundle: "safe_rl_output/runs/accvp_240_shadow_train/accvp/accvp_v1_calibration.json"
        operating_point: "safe_rl_output/runs/accvp_240_lite_v3/accvp/accvp_v1_lite_v3_operating_point.json"
        artifact_manifest: "safe_rl_output/runs/accvp_240_lite_v3/accvp/accvp_v1_lite_v3_task_artifact_manifest.json"
        risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
        observation:
          enabled: true
          feature_version: "risk_gated_candidate_table_v1"
          activation_distance: 240.0
          timeout_s: 0.5
          use_inference_worker: false
          profile_latency: true
          fail_closed_defaults: true
          include_risk_secondary: true
          secondary_safety_profile: "short_horizon_risk_v1"
          risk_horizon_steps: 8
          allow_with_forecast_features: false
