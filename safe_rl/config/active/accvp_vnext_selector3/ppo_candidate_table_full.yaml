extends: safe_rl/config/active/accvp_vnext/ppo_candidate_table_full.yaml

run:
  run_id: "ppo_accvp_vnext_selector3_template"

experiment:
  replicate_run_id_prefix: "ppo_accvp_vnext_selector3"

evaluation_protocol:
  protocol_id: "accvp-vnext-correctness-v2-selector3"
  seed_ledger: "safe_rl/config/accvp_vnext_selector3_seed_ledger.json"
  revocation_manifest: "safe_rl/config/artifact_revocation_manifest_selector3.json"

accvp:
  actor_relevance:
    version: "candidate_union_conflict_relevance_v3"
    candidate_conflict_horizon_s: 3.0
    candidate_conflict_surface_gap: 30.0
    actor_longitudinal_accel_bound: 2.0
    local_actor_distance: 45.0
    critical_taper_distance: 120.0
  data_contract_version: "accvp_240_v3_conflict_selector"
  selector_contract:
    require_capacity_lock: true
    audit_report: "safe_rl_output/runs/accvp_vnext_selector3_audit/selector_contract_audit.json"
  checkpoint: "safe_rl_output/runs/accvp_vnext_selector3_train/accvp/accvp_vnext_schema3_predictor.pt"
  calibration_bundle: "safe_rl_output/runs/accvp_vnext_selector3_train/accvp/accvp_vnext_schema3_calibration.json"
  operating_point: "safe_rl_output/runs/accvp_vnext_selector3_train/accvp/accvp_vnext_schema3_operating_point.json"
  artifact_manifest: "safe_rl_output/runs/accvp_vnext_selector3_train/accvp/accvp_vnext_schema3_candidate_manifest.json"
