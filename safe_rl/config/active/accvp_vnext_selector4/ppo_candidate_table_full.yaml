extends: safe_rl/config/active/accvp_vnext_selector3/ppo_candidate_table_full.yaml

run:
  run_id: "ppo_accvp_vnext_selector4_hybrid_blocking_exact_template"

experiment:
  replicate_run_id_prefix: "ppo_accvp_vnext_selector4_hybrid_blocking_exact"
  closed_loop_execution_protocol: "simulation_blocking_exact_v1"

training:
  # Four independent SUMO workers preserve the frozen 1024-sample rollout
  # budget while removing the single-environment throughput bottleneck.
  ppo_num_envs: 4
  ppo_start_method: "spawn"
  ppo_worker_torch_threads: 1
  ppo_main_torch_threads: 4
  ppo_expected_rollout_size: 1024
  # Bounded outer parallelism is implemented, but this machine-specific choice
  # remains serial until the 1x4-vs-2x2 throughput smoke is accepted.
  max_parallel_optimizer_replicates: 1

rl:
  n_steps: 256

stage3:
  # The 50 frozen selection seeds are evaluated independently. The parent
  # process sorts per-seed reports before computing the unchanged aggregate.
  checkpoint_selection_workers: 4
  checkpoint_selection_worker_torch_threads: 1
  checkpoint_selection_start_method: "spawn"

evaluation_protocol:
  protocol_id: "accvp-vnext-correctness-v4-selector4-hybrid"
  seed_ledger: "safe_rl/config/accvp_vnext_selector4_hybrid_seed_ledger.json"
  revocation_manifest: "safe_rl/config/artifact_revocation_manifest_selector4_hybrid.json"
  cohort_roles:
    selector_diagnostic: "selector_historical_development"
    selector_historical_development: "selector_historical_development"
    selector_stress_development: "selector_stress_development"

accvp:
  actor_relevance:
    version: "merge_conflict_relevance_v4_lane_aware"
  data_contract_version: "accvp_240_v5_hybrid_actor_summary"
  root_observation_fingerprint_version: "model_input_fingerprint_v4_hybrid_actor_summary"
  omitted_actor_summary:
    enabled: true
    contract_version: "accvp_omitted_actor_summary_v1"
    physical_actor_capacity: 12
  selector_contract:
    require_capacity_lock: true
    audit_report: "safe_rl_output/runs/accvp_vnext_selector4_audit/selector_capacity_audit.json"
  checkpoint: "safe_rl_output/runs/accvp_vnext_selector4_hybrid_train/accvp/accvp_vnext_schema3_predictor.pt"
  calibration_bundle: "safe_rl_output/runs/accvp_vnext_selector4_hybrid_train/accvp/accvp_vnext_schema3_calibration.json"
  operating_point: "safe_rl_output/runs/accvp_vnext_selector4_hybrid_train/accvp/accvp_vnext_schema3_operating_point.json"
  artifact_manifest: "safe_rl_output/runs/accvp_vnext_selector4_hybrid_train/accvp/accvp_vnext_schema3_candidate_manifest.json"
  observation:
    # PPO training, checkpoint selection and Stage5 run with SUMO blocked until
    # the complete Candidate Table is available. The 0.5 s value remains a
    # profiled deployment deadline and cannot replace a correctly computed
    # observation in this method-effect contract.
    execution_contract: "simulation_blocking_exact_v1"
    deployment_deadline_s: 0.5
    invalid_table_strategy: "fail_closed_v1"
    use_inference_worker: false
    profile_latency: true
    fail_closed_defaults: true
    invalid_table_dropout_rate: 0.0
