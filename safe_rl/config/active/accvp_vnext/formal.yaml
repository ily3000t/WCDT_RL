# Frozen schema-v3 VNext collection. It is gated by the matching VNext pilot
# report and uses paths that cannot collide with legacy schema-v2 artifacts.
run:
  run_id: "accvp_vnext_formal"
  output_root: "safe_rl_output/runs"
  cache_root: "safe_rl_output/.cache/accvp_vnext_formal"
  seed: 10001
  tensorboard: false

evaluation_protocol:
  strict: true
  protocol_id: "accvp-vnext-correctness-v1"
  seed_ledger: "safe_rl/config/accvp_vnext_seed_ledger.json"
  revocation_manifest: "safe_rl/config/artifact_revocation_manifest_vnext.json"
  cohort_roles:
    data_collection: "data_collection"

stage1:
  episodes: 250

accvp:
  enabled: false
  mode: "off"
  artifact_generation: "vnext_schema3"
  schema_version: 3
  data_contract_version: "accvp_240_v2"
  actor_row_mapping_version: "selected_indices_v2"
  root_observation_fingerprint_version: "model_input_fingerprint_v3"
  entry_time_label_version: "conditional_entry_time_v1"
  loss_version: "accvp_loss_v2"
  activation_distance: 240.0
  candidate_plan_profile: "accvp_commitment_v1"
  response_horizon_s: 3.0
  response_horizon_steps: 30
  viability_horizon_s: 8.0
  candidate_plan_horizon_steps: 80
  warm_start:
    checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/wcdt_v3_predictor.pt"
  counterfactual:
    collection_phase: "formal"
    incomplete_shard_policy: "quarantine"
    root_budget: 5000
    output_name: "accvp_vnext_schema3_formal"
    cache_root: "safe_rl_output/.cache/accvp_vnext_formal"
    required_pilot_report: "safe_rl_output/runs/accvp_vnext_pilot/pilot_report.json"
    workers: 2
    shard_roots: 50
    risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
    policy_checkpoints:
      ppo: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage3/ppo_model.zip"
      merge_timing: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001_forecast_wcdt_v3/stage3/ppo_model.zip"
    # The seed-2/5 oracle regression is deliberately absent. It remains an
    # oracle-only premise check and is never merged into this formal pool.
    collection_jobs:
      - {name: "mixed_vnext_formal", collection_source: "mixed", root_policy: "mixed", root_filter: "all", root_budget: 1000, roots_per_episode_limit: 3}
      - name: "ppo_vnext_formal"
        collection_source: "ppo"
        root_policy: "ppo"
        root_filter: "all"
        root_budget: 1000
        roots_per_episode_limit: 3
        root_policy_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage3/ppo_model.zip"
        config_overrides:
          forecast_features: {enabled: false}
          rl: {use_wcdt_forecast_features: false}
      - name: "merge_timing_vnext_formal"
        collection_source: "merge_timing"
        root_policy: "merge_timing"
        root_filter: "all"
        root_budget: 1000
        roots_per_episode_limit: 3
        root_policy_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001_forecast_wcdt_v3/stage3/ppo_model.zip"
        config_overrides:
          forecast_features:
            enabled: true
            use_for_ppo_observation: true
            source: "wcdt_v3"
            checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/wcdt_v3_predictor.pt"
            allow_heuristic_fallback: false
          rl: {use_wcdt_forecast_features: true, reward_profile: "merge_timing_forecast"}
      - {name: "rule_vnext_formal", collection_source: "rule", root_policy: "rule", root_filter: "all", root_budget: 1000, roots_per_episode_limit: 3}
      - {name: "deadline_hard_vnext_formal", collection_source: "deadline_hard", root_policy: "mixed", root_filter: "activation_window", root_budget: 1000, roots_per_episode_limit: 3}
