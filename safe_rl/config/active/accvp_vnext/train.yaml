run:
  run_id: "accvp_vnext_train"
  output_root: "safe_rl_output/runs"
  tensorboard: false

# Freeze the formal batch-training device in the config lineage. Calibration,
# operating-point selection and all runtime inference remain on CPU.
training:
  stage2_device: "cuda:0"

experiment:
  note: "VNext formal ACCVP training: schema-v3 actor rows, leakage-free component splits, loss-v2, three-member ensemble."

evaluation_protocol:
  strict: true
  protocol_id: "accvp-vnext-correctness-v1"
  seed_ledger: "safe_rl/config/accvp_vnext_seed_ledger.json"
  revocation_manifest: "safe_rl/config/artifact_revocation_manifest_vnext.json"
  cohort_roles:
    data_collection: "data_collection"
    oracle_regression: "oracle_regression"

accvp:
  enabled: false
  mode: "off"
  artifact_generation: "vnext_schema3"
  schema_version: 3
  data_contract_version: "accvp_240_v2"
  activation_distance: 240.0
  ensemble_size: 3
  dataset_dir: "safe_rl_output/runs/accvp_vnext_formal_dataset"
  oracle_report: "safe_rl_output/runs/accvp_vnext_oracle_regression/oracle_report.json"
  oracle:
    required_seeds: [2, 5]
    cohort_role: "oracle_regression"
    exclude_from_model_splits: true
  checkpoint: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_predictor.pt"
  calibration_bundle: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_calibration.json"
  operating_point: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_operating_point.json"
  artifact_manifest: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_candidate_manifest.json"
  risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
  # Frozen runtime semantics carried into every VNext bundle.  The formal
  # benchmark and final holdout must reproduce this contract byte-for-byte.
  formal_runtime_contract:
    candidate_geometry_backend: "vectorized"
    enabled: true
    feature_version: "risk_gated_candidate_table_v3_bounded_stale"
    activation_distance: 240.0
    include_risk_secondary: true
    secondary_safety_profile: "short_horizon_risk_v1"
    risk_horizon_steps: 8
    invalid_table_strategy: "bounded_last_valid_v2"
    fail_closed_defaults: true
    timeout_s: 0.5
    timeout_contract: "soft_realtime_post_return_v1"
    full_table_hard_deadline_worker: false
    use_inference_worker: false
    profile_latency: true
    warmup_enabled: true
    warmup_max_attempts: 3
    invalid_table_dropout_rate: 0.0
    last_valid_max_decisions: 1
    last_valid_ttl_s: 0.5
    last_valid_max_merge_distance_delta_m: 15.0
    last_valid_max_ego_speed_delta_mps: 3.0
    last_valid_max_gap_delta_m: 8.0
  # Final holdout uses this same file, so the effective runtime settings must
  # equal the declared contract rather than inheriting legacy disabled values.
  observation:
    enabled: true
    feature_version: "risk_gated_candidate_table_v3_bounded_stale"
    activation_distance: 240.0
    include_risk_secondary: true
    secondary_safety_profile: "short_horizon_risk_v1"
    risk_horizon_steps: 8
    invalid_table_strategy: "bounded_last_valid_v2"
    fail_closed_defaults: true
    timeout_s: 0.5
    timeout_contract: "soft_realtime_post_return_v1"
    full_table_hard_deadline_worker: false
    use_inference_worker: false
    profile_latency: true
    warmup_enabled: true
    warmup_max_attempts: 3
    invalid_table_dropout_rate: 0.0
    last_valid_max_decisions: 1
    last_valid_ttl_s: 0.5
    last_valid_max_merge_distance_delta_m: 15.0
    last_valid_max_ego_speed_delta_mps: 3.0
    last_valid_max_gap_delta_m: 8.0
    allow_with_forecast_features: false
  viability_lite:
    secondary_safety_profile: "strict"
    min_left_p_merge_before_taper_grid: [0.75, 0.80, 0.85, 0.90]
    min_improvement_over_raw_grid: [0.005, 0.01, 0.02, 0.05]
    max_target_entry_time_s_grid: [4.0, 6.0, 8.0]
    max_ensemble_disagreement_grid: [0.02, 0.05, 0.10]
    max_secondary_risk_score_grid: [0.05, 0.10, 0.20]
    max_replacement_rate: 0.10
    acceptance:
      require_replacement: true
      min_effective_decision_count: 1000
      min_unique_episode_seed_count: 30
      min_effective_split_component_count: 30
      min_replacement_count: 20
      min_replacement_unique_episode_seed_count: 10
      min_replacement_effective_split_component_count: 10
      min_replacement_observed_mass: 20.0
      min_repairable_decision_mass: 20.0
      max_replacement_safety_event_rate: 0.0
      min_replacement_merge_success_rate: 0.90
      max_replacement_unnecessary_rate: 0.25
      max_replacement_rate: 0.10
      min_replacement_repairable_capture_rate: 0.05
  response_horizon_s: 3.0
  response_horizon_steps: 30
  viability_horizon_s: 8.0
  candidate_plan_horizon_steps: 80
  warm_start:
    enabled: true
    checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/wcdt_v3_predictor.pt"
    freeze_encoder_epochs: 5
    encoder_lr_multiplier: 0.1
  training:
    deterministic: true
    deterministic_torch_threads: 1
    epochs: 20
    batch_size: 32
    learning_rate: 0.0003
    weight_decay: 0.00001
    ensemble_seed_offset: 1000
    loss_weights:
      trajectory: 1.0
      events: 1.0
      # All heads are trained and calibrated so the table and ensemble
      # disagreement are meaningful. ACCVP safety heads remain diagnostic-only;
      # hard safety authority stays with Risk/Shield.
      event_loss_weights: [1.0, 1.0, 1.0, 1.0]
      geometry: 0.25
      ordering: 0.10
      smoothness: 0.01
      response_feature_scales: "auto_train"
    response_feature_scale_minimums: [1.0, 1.0, 0.1, 1.0, 0.5]
  tuning:
    # The 0.95 gate measures model availability only where the frozen Risk
    # authority permits raw retention or at least one merge-left rescue.
    # Unconditional runtime coverage is reported separately and Risk-
    # ineligible states always remain fail closed.
    availability_denominator: "risk_eligible_raw_or_merge_left_v1"
