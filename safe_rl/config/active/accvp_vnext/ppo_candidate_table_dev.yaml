run:
  run_id: "ppo_accvp_candidate_table_vnext_dev"
  seed: 20001
  output_root: "safe_rl_output/runs"
  tensorboard: true

training:
  # Guard the optimizer update batch while experimenting with parallel SUMO.
  # For two envs, override this file with ppo_num_envs=2 and rl.n_steps=512.
  ppo_expected_rollout_size: 1024
  replay: false

experiment:
  note: "VNext bounded-stale Candidate Table development run; not a formal comparison artifact."
  method_id: "candidate_table_reward_v2_dev"

forecast_features:
  enabled: false

rl:
  use_wcdt_forecast_features: false
  reward_profile: "merge_timing_forecast"
  training_semantics_version: "reward_v2_mainline_001+risk_gated_candidate_table_v3_bounded_stale"
  optimizer_seed: 1001
  total_timesteps: 5000
  merge_timing_reward:
    reward_version: "opportunity_window_v2"
  shield_guided_reward:
    risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
  policy_lateral_commitment:
    enabled: false
    profile: "left_intent_1s_risk_gated_v2"
    duration_s: 1.0
    preserve_raw_accel: true

accvp:
  enabled: false
  mode: "off"
  artifact_generation: "vnext_schema3"
  schema_version: 3
  data_contract_version: "accvp_240_v2"
  activation_distance: 240.0
  ensemble_size: 3
  checkpoint: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_predictor.pt"
  calibration_bundle: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_calibration.json"
  operating_point: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_operating_point.json"
  artifact_manifest: "safe_rl_output/runs/accvp_vnext_train/accvp/accvp_vnext_schema3_candidate_manifest.json"
  risk_checkpoint: "safe_rl_output/runs/safe_rl_comparison_schema9_validation_001/stage2/risk_module.pt"
  observation:
    enabled: true
    feature_version: "risk_gated_candidate_table_v3_bounded_stale"
    activation_distance: 240.0
    timeout_s: 0.5
    timeout_contract: "soft_realtime_post_return_v1"
    full_table_hard_deadline_worker: false
    use_inference_worker: false
    profile_latency: true
    fail_closed_defaults: true
    invalid_table_strategy: "bounded_last_valid_v2"
    invalid_table_dropout_rate: 0.05
    last_valid_max_decisions: 1
    last_valid_ttl_s: 0.5
    last_valid_max_merge_distance_delta_m: 15.0
    last_valid_max_ego_speed_delta_mps: 3.0
    last_valid_max_gap_delta_m: 8.0
    warmup_enabled: true
    warmup_max_attempts: 3
    include_risk_secondary: true
    secondary_safety_profile: "short_horizon_risk_v1"
    risk_horizon_steps: 8
    allow_with_forecast_features: false
